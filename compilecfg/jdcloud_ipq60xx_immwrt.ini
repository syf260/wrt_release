
REPO_URL=https://github.com/VIKINGYFY/immortalwrt.git
REPO_BRANCH=ain 
BUILD_DIR=imm-nss
CONFIG_PACKAGE_coremark=y

# 机型基础配置
TARGET_BOARD="ipq60xx"
TARGET_SUBTARGET="generic"
TARGET_PROFILE="DEVICE_jdcloud_re-sp-01a"
TARGET_OPTIMIZATION="-O2 -march=armv8-a+crc -mtune=cortex-a53"
TARGET_ROOTFS_SQUASHFS=y

# Docker插件
CONFIG_PACKAGE_docker=y
CONFIG_PACKAGE_docker-compose=y
CONFIG_PACKAGE_luci-app-docker=y
CONFIG_PACKAGE_luci-lib-docker=y
CONFIG_PACKAGE_kmod-docker=y
CONFIG_PACKAGE_containerd=y
CONFIG_PACKAGE_runc=y

# IPTV组播（rtp2httpd）
CONFIG_PACKAGE_rtp2httpd=y
CONFIG_PACKAGE_luci-app-rtp2httpd=y
CONFIG_PACKAGE_igmpproxy=y
CONFIG_PACKAGE_ssdpd=y

# DDNS动态域名解析
CONFIG_PACKAGE_ddns-scripts=y
CONFIG_PACKAGE_luci-app-ddns=y
CONFIG_PACKAGE_ddns-scripts_aliyun=y
CONFIG_PACKAGE_ddns-scripts_dnspod=y
CONFIG_PACKAGE_ddns-scripts_cloudflare=y
CONFIG_PACKAGE_curl=y

# OpenClash
CONFIG_PACKAGE_luci-app-openclash=y
CONFIG_PACKAGE_openclash=y

# 网页终端ttyd
CONFIG_PACKAGE_ttyd=y
CONFIG_PACKAGE_luci-app-ttyd=y

# 网络优化
CONFIG_DEFAULT_TCP_CONGESTION="bbr"
CONFIG_KERNEL_IP_TRANSPARENT_PROXY=y
